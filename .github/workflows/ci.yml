name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Official Astral action — installs Ruff from uv.lock and runs `ruff check`.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: format --check

      # No ty-action yet; use setup-uv + locked ty from the project env.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --locked --group dev
      # error-on-warning is also set in [tool.ty.terminal]; pass explicitly for CI clarity.
      - run: uv run ty check --error-on-warning

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked --group dev
      - run: >-
          uv run pytest -v
          --cov --cov-report=term-missing --cov-fail-under=100
          --strict-markers --strict-config

  package:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - run: uv build
      - run: uvx twine check dist/*

      - name: Smoke-test wheel
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          uv venv --python 3.14 /tmp/wheel-smoke
          uv pip install --python /tmp/wheel-smoke "$wheel" \
            'netboxlabs-diode-sdk>=1.0.0' \
            'netboxlabs-orb-worker>=1.0.0'
          /tmp/wheel-smoke/bin/python - <<'PY'
          import importlib.metadata
          from importlib.resources import files
          from pathlib import Path
          from worker.backend import load_class

          import orb_extreme_platformone as pkg

          assert pkg.__version__ == importlib.metadata.version("netbox-orb-extreme-platformone")
          assert "Backend" not in pkg.__dict__, "Backend must stay lazy"
          assert files("orb_extreme_platformone").joinpath("py.typed").is_file()
          cls = load_class("orb_extreme_platformone")
          assert cls is pkg.Backend
          assert Path(pkg.__file__).resolve().as_posix().endswith(
              "/site-packages/orb_extreme_platformone/__init__.py"
          )
          print("wheel smoke ok", pkg.__version__, cls.__module__)
          PY

  # There is no scheduled live-spec contract job anymore: the Platform ONE
  # OpenAPI specs sit behind the developer portal's login wall, with no
  # stable unauthenticated URL to fetch them from. The contract checks still
  # exist (tests/test_openapi_contract.py) but run against locally
  # downloaded spec files -- see that module's docstring.
