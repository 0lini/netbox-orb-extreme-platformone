[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-orb-extreme-platformone"
dynamic = ["version"]
description = "Extreme Platform ONE discovery worker for the NetBox Labs Orb Agent (extract → transform → Diode → NetBox)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Oliver Elsner", email = "oliver.elsner@lvndl.de" },
]
keywords = [
    "netbox",
    "orb",
    "diode",
    "extreme",
    "platform-one",
    "network-automation",
    "discovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    # The Orb Agent image ships these; pinned here so the package is
    # testable/runnable standalone too.
    "netboxlabs-diode-sdk>=1.0.0",
    "netboxlabs-orb-worker>=1.0.0",
]

# Keep a pip-compatible extra for consumers that are not on uv yet.
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.15",
    "ty>=0.0.63",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.15",
    "ty>=0.0.63",
]

[project.urls]
Homepage = "https://github.com/0lini/netbox-orb-extreme-platformone"
Repository = "https://github.com/0lini/netbox-orb-extreme-platformone"
Issues = "https://github.com/0lini/netbox-orb-extreme-platformone/issues"
Changelog = "https://github.com/0lini/netbox-orb-extreme-platformone/blob/main/CHANGELOG.md"

[project.scripts]
orb-extreme-platformone = "orb_extreme_platformone.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orb_extreme_platformone*"]

[tool.setuptools.package-data]
orb_extreme_platformone = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "orb_extreme_platformone._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not contract' --strict-markers --strict-config"
markers = [
    "contract: checks locally downloaded Platform ONE OpenAPI specs (excluded by default; run with `pytest -m contract`, see tests/test_openapi_contract.py)",
]

[tool.coverage.run]
branch = true
source = ["orb_extreme_platformone"]
omit = ["*/orb_extreme_platformone/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:", "raise AttributeError"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Keep complexity checks out of the default gate for transform builders.
    "C901",
    "PLR0912",
    "PLR0913",
    # Helper-heavy transforms intentionally use dynamic values/threshold literals.
    "PLR2004",
    # Intentionally use lazy imports in a few integration points.
    "PLC0415",
    # Explicit list-building reads better than some suggested rewrites.
    "PERF401",
    # Project does not require file-level copyright banners.
    "CPY001",
    # Keep existing helper-style APIs without full annotation/docstring churn.
    "ANN001",
    "ANN003",
    "ANN202",
    "D102",
    "D103",
    "D107",
    "D205",
    "D401",
    "FBT001",
    "FBT002",
    "FBT003",
    # Existing docs intentionally use en dashes for numeric ranges.
    "RUF002",
    "RUF003",
    # Requests timeout is injected centrally via kwargs.setdefault.
    "S113",
]

[tool.ruff.lint.isort]
known-first-party = ["orb_extreme_platformone"]

[tool.ruff.lint.per-file-ignores]
# Pytest intentionally relies on asserts, private-attribute inspection of test
# doubles, and broad fixture signatures.
"tests/**" = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ARG001",
    "D101",
    "D102",
    "D103",
    "D107",
    "D205",
    "FBT001",
    "FBT002",
    "FBT003",
    "PLR2004",
    "S101",
    "S106",
    "SLF001",
    "D104",
    "D105",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.uv]
package = true

[tool.ty.environment]
python-version = "3.10"
root = ["./src"]

[tool.ty.src]
# Package sources only — pytest fixtures are not part of the typed public API.
exclude = ["tests/**", "**/test_*.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
# Diode/Orb SDK stubs are incomplete or mix protobuf wrappers with Python types.
replace-imports-with-any = [
    "netboxlabs.**",
    "worker.**",
    "google.protobuf.**",
]

