[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-orb-extreme-platformone"
dynamic = ["version"]
description = "Extreme Platform ONE discovery worker for the NetBox Labs Orb Agent (extract → transform → Diode → NetBox)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Oliver Elsner", email = "oliver.elsner@lvndl.de" },
]
keywords = [
    "netbox",
    "orb",
    "diode",
    "extreme",
    "platform-one",
    "network-automation",
    "discovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    # The Orb Agent image ships these; pinned here so the package is
    # testable/runnable standalone too.
    "netboxlabs-diode-sdk>=1.0.0",
    "netboxlabs-orb-worker>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.15",
    "mypy>=1.14",
    "types-requests>=2.31",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/0lini/netbox-orb-extreme-platformone"
Repository = "https://github.com/0lini/netbox-orb-extreme-platformone"
Issues = "https://github.com/0lini/netbox-orb-extreme-platformone/issues"
Changelog = "https://github.com/0lini/netbox-orb-extreme-platformone/blob/main/README.md"

[project.scripts]
orb-extreme-platformone = "orb_extreme_platformone.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orb_extreme_platformone*"]

[tool.setuptools.package-data]
orb_extreme_platformone = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "orb_extreme_platformone._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not contract'"
markers = [
    "contract: checks locally downloaded Platform ONE OpenAPI specs (excluded by default; run with `pytest -m contract`, see tests/test_openapi_contract.py)",
]

[tool.coverage.run]
branch = true
source = ["orb_extreme_platformone"]
omit = ["*/orb_extreme_platformone/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise AttributeError"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "ARG",
    "PT",
    "S",
    "C90",
    "PERF",
    "RUF",
]
ignore = [
    # Orb/Diode entity builders intentionally use many locals/branches.
    "C901",
    # Entity lists are built across ordered phases; list-comp rewrites hurt clarity.
    "PERF401",
    # Domain docs use en-dashes in VLAN ranges (4060–4094); keep readable prose.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["orb_extreme_platformone"]

[tool.ruff.lint.per-file-ignores]
# Fixture params (e.g. `stub_sdk`) are applied for their monkeypatching side
# effect, not read in the test body -- the standard pytest fixture pattern.
# Test doubles intentionally pass placeholder tokens/passwords.
"tests/*" = ["ARG001", "S101", "S106", "RUF015"]
# Standalone dry-run CLI reads a local .env by design.
"src/orb_extreme_platformone/__main__.py" = ["S104"]
# Timeout is always injected via kwargs.setdefault before the request call.
"src/orb_extreme_platformone/bootstrap.py" = ["S113"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
pretty = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["orb_extreme_platformone"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "netboxlabs.*",
    "worker.*",
    "google.protobuf.*",
]
ignore_missing_imports = true

# Diode's published stubs mix protobuf messages with Python wrapper classes
# (Entity/Device/Tag/Location), which mypy treats as incompatible list elements.
[[tool.mypy.overrides]]
module = [
    "orb_extreme_platformone.transform.*",
    "orb_extreme_platformone.__main__",
]
disable_error_code = ["arg-type", "assignment", "return-value", "attr-defined"]
